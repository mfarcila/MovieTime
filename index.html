<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieTime</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand"> MovieTime</span>
</nav>

<div class="container mt-4">

<input type="text" id="buscador" class="form-control mb-4" placeholder="Buscar película...">

<div class="row g-4">

<div class="col-12 col-sm-6 col-md-4 pelicula" onclick="ver('michael')">
<div class="card movie-card">
<img src="michael.jpg" class="card-img-top">
<div class="card-body"><h5>Michael</h5></div>
</div>
</div>

<div class="col-12 col-sm-6 col-md-4 pelicula" onclick="ver('prada')">
<div class="card movie-card">
<img src="diablo.webp" class="card-img-top">
<div class="card-body"><h5>El Diablo viste a la moda</h5></div>
</div>
</div>

<div class="col-12 col-sm-6 col-md-4 pelicula" onclick="ver('mario')">
<div class="card movie-card">
<img src="https://upload.wikimedia.org/wikipedia/en/4/44/The_Super_Mario_Bros._Movie_poster.jpg" class="card-img-top">
<div class="card-body"><h5>Super Mario Bros</h5></div>
</div>
</div>

</div>

</div>

<div id="detalle" class="detalle">
<div class="contenido">

<button onclick="cerrar()" class="btn btn-light mb-3">⬅ Volver</button>

<h2 id="titulo"></h2>
<img id="imagen" class="img-fluid mb-3">

<p><strong>Duración:</strong> <span id="duracion"></span></p>
<p><strong>Género:</strong> <span id="genero"></span></p>

<p id="sinopsis"></p>

<h4>Calificación</h4>
<div id="estrellas">
<span class="estrella" data="1">★</span>
<span class="estrella" data="2">★</span>
<span class="estrella" data="3">★</span>
<span class="estrella" data="4">★</span>
<span class="estrella" data="5">★</span>
</div>

<p id="resultado"></p>
<h4>Comentarios</h4>
<textarea id="comentario" class="form-control mb-2" placeholder="Escribe tu opinión..."></textarea>
<button onclick="agregarComentario()" class="btn btn-primary mb-3">Enviar</button>

<div id="listaComentarios"></div>
</div>
</div>

<script src="script.js"></script>

</body>
</html>
